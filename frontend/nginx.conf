server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz { access_log off; return 200 'ok'; }

  # Used only by docker-compose / local dev. In K3s the Traefik Ingress routes /api/*.
  location /api/users/    { proxy_pass http://user-service:3001; }
  location /api/products  { proxy_pass http://catalog-service:3002; }
  location /api/orders    { proxy_pass http://order-service:3003; }

  location / { try_files $uri /index.html; }
}
