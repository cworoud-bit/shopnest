apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: shopnest }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-traefik, namespace: shopnest }
spec:
  podSelector: { matchLabels: { tier: app } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: order-to-catalog, namespace: shopnest }
spec:
  podSelector: { matchLabels: { app: catalog-service } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: order-service } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-from-sql-services, namespace: shopnest }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: user-service } }
        - podSelector: { matchLabels: { app: order-service } }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mongo-from-catalog, namespace: shopnest }
spec:
  podSelector: { matchLabels: { app: mongo } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: catalog-service } } }]
      ports: [{ port: 27017 }]
