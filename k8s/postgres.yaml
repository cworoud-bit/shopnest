apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: shopnest, labels: { app: postgres } }
spec:
  clusterIP: None            # headless, stable DNS for the StatefulSet
  selector: { app: postgres }
  ports: [{ name: pg, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: shopnest }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, tier: database } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: [sh, -c, "pg_isready -U $POSTGRES_USER"] }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { exec: { command: [sh, -c, "pg_isready -U $POSTGRES_USER"] }, initialDelaySeconds: 30, periodSeconds: 20 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: init, configMap: { name: postgres-init } }
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path   # K3s default provisioner
        resources: { requests: { storage: 2Gi } }
