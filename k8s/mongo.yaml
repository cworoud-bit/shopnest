apiVersion: v1
kind: Service
metadata: { name: mongo, namespace: shopnest, labels: { app: mongo } }
spec:
  clusterIP: None
  selector: { app: mongo }
  ports: [{ name: mongo, port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongo, namespace: shopnest }
spec:
  serviceName: mongo
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo, tier: database } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ name: mongo, containerPort: 27017 }]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, valueFrom: { secretKeyRef: { name: mongo-credentials, key: username } } }
            - { name: MONGO_INITDB_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: mongo-credentials, key: password } } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"] }, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"] }, initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 2Gi } }
