apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopnest
  namespace: shopnest
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:       # add `host: shop.example.com` + TLS (cert-manager) for production
        paths:
          - { path: /api/users,    pathType: Prefix, backend: { service: { name: user-service,    port: { number: 3001 } } } }
          - { path: /api/products, pathType: Prefix, backend: { service: { name: catalog-service, port: { number: 3002 } } } }
          - { path: /api/orders,   pathType: Prefix, backend: { service: { name: order-service,   port: { number: 3003 } } } }
          - { path: /,             pathType: Prefix, backend: { service: { name: frontend,        port: { number: 80 } } } }
