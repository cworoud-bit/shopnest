apiVersion: v1
kind: ServiceAccount
metadata: { name: order-service, namespace: shopnest }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: order-service, namespace: shopnest, labels: { app: order-service } }
spec:
  selector: { app: order-service }
  ports: [{ name: http, port: 3003, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service, namespace: shopnest, labels: { app: order-service } }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service, tier: app } }
    spec:
      serviceAccountName: order-service
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: order-service } }
      containers:
        - name: order-service
          image: shopnest/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3003 }]
          env:
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } } }
            - { name: DB_NAME, valueFrom: { configMapKeyRef: { name: app-config, key: ORDERS_DB_NAME } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } } }
            - { name: CATALOG_URL, valueFrom: { configMapKeyRef: { name: app-config, key: CATALOG_URL } } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe:   { httpGet: { path: /healthz, port: http }, periodSeconds: 3, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 20, timeoutSeconds: 3 }
          lifecycle: { preStop: { exec: { command: [sh, -c, "sleep 5"] } } }
      terminationGracePeriodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-service, namespace: shopnest }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: order-service, namespace: shopnest }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: order-service } }
