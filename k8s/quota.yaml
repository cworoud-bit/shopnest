apiVersion: v1
kind: ResourceQuota
metadata: { name: shopnest-quota, namespace: shopnest }
spec:
  hard: { requests.cpu: "4", requests.memory: 4Gi, limits.cpu: "8", limits.memory: 8Gi, pods: "40" }
---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: shopnest }
spec:
  limits:
    - type: Container
      default: { cpu: 200m, memory: 128Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
